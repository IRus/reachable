# Через этот резолвер разрешается ровно одно имя — valhalla1.openstreetmap.de,
# внутренних имён здесь нет. Поэтому берём публичные серверы, а не встроенный
# DNS Docker (127.0.0.11): тот существует только в пользовательских сетях, и с
# ним образ нельзя запустить обычным docker run.
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

# Изохроны считает общественный сервер FOSSGIS. Он бесплатный и без ключа, но
# просят его не грузить. Ограничение по адресу клиента — наша часть договора.
limit_req_zone $binary_remote_addr zone=iso:10m rate=20r/m;

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Прокси к Valhalla. Ключа нет, но прокси всё равно нужен: он держит запрос
  # на том же origin (никакого CORS) и ограничивает частоту.
  location /iso/ {
    limit_req zone=iso burst=10 nodelay;

    # Адрес в переменной, а не строкой. Со строкой nginx резолвит имя один раз
    # при старте и держит адрес до перезапуска, а с переменной перечитывает его
    # по TTL резолвера. Тот же приём используется в ingress ibragimov.by.
    # Побочный эффект: nginx перестаёт сам срезать префикс, его срезает rewrite.
    set $iso_upstream https://valhalla1.openstreetmap.de;
    rewrite ^/iso/(.*)$ /$1 break;
    proxy_pass $iso_upstream;

    proxy_ssl_server_name on;
    proxy_set_header Host valhalla1.openstreetmap.de;
    # FOSSGIS просит представляться, чтобы можно было связаться при проблемах.
    proxy_set_header User-Agent "reachable.heapyhop.com (https://github.com/IRus/reachable)";

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
  }

  # Сборка Vite: в имени каждого файла есть хеш содержимого.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Иконки без хеша в имени. Меняются примерно никогда, а service worker
  # всё равно сверяет их по ревизии.
  location /icons/ {
    add_header Cache-Control "public, max-age=604800";
  }

  # Эти файлы решают, на какой сборке окажется клиент, поэтому не должны
  # приходить из устаревшего HTTP-кэша.
  location = / {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache";
  }

  location ~ "^/workbox-[0-9a-f]+\.js$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
